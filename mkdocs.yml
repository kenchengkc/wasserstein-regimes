site_name: Wasserstein Regimes
site_description: Market regime research using full return distributions and optimal transport.
repo_url: https://github.com/kenchengkc/wasserstein-regimes
repo_name: kenchengkc/wasserstein-regimes
copyright: Original project code and documentation licensed under GNU GPL v3 only.
theme:
  name: material
  font: false
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.footer
    - content.code.copy
nav:
  - Overview: index.md
  - Research roadmap: research-roadmap.md
  - Robustness protocol: joint-validation-protocol.md
  - Robustness implementation: joint-validation-plan.md
  - Joint market results: joint-market-results.md
  - Joint market protocol: joint-market-protocol.md
  - Joint market plan: joint-market-plan.md
  - Joint engine: joint-results.md
  - Joint design: joint-design.md
  - Joint implementation: joint-implementation-plan.md
  - Cross-asset results: cross-asset-results.md
  - Study results: research-results.md
  - Research workflow: research-workflow.md
  - System design: design.md
  - Data sourcing: data.md
  - Implementation plan: implementation-plan.md
  - Paper review: paper-review.md
plugins:
  - search
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
