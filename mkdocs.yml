site_name: Wasserstein Regimes
site_description: Market regime research using full return distributions and optimal transport.
repo_url: https://github.com/kenchengkc/wasserstein-regimes
repo_name: kenchengkc/wasserstein-regimes
copyright: Original project code and documentation licensed under GNU GPL v3 only.
theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/wasserstein-regimes-logo.png
  favicon: assets/brand/wasserstein-regimes-logo.png
  font: false
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
nav:
  - Overview: index.md
  - Research:
      - Methods: methods.md
      - Univariate study: research-results.md
      - Cross-asset replication: cross-asset-results.md
      - Joint synthetic controls: joint-results.md
      - Joint market panel: joint-market-results.md
      - Robustness: joint-validation-results.md
      - Risk forecasting: risk-results.md
      - Execution measurements: execution-results.md
      - Motivating paper: paper-review.md
  - Reproducibility:
      - Data sources and conventions: data.md
      - Univariate workflow: research-workflow.md
      - Frozen scoring and jobs: execution-workflow.md
      - Risk forecasting workflow: risk-workflow.md
      - Study protocols:
          - Joint market: joint-market-protocol.md
          - Robustness: joint-validation-protocol.md
          - Risk forecasting: risk-protocol.md
  - Research agenda: research-roadmap.md
plugins:
  - search
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - stylesheets/brand.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
